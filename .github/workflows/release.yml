name: Release Snap to Ubuntu Store

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Linux Binaries (yt-dlp & ffmpeg)
        run: |
          mkdir -p bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
          chmod +x bin/yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cp /usr/bin/ffmpeg bin/ffmpeg
          chmod +x bin/ffmpeg
          ls -lh bin/

      - name: Build Web Assets
        run: npm run build

      - name: Build Snap Package
        run: npx electron-builder --linux snap --publish never

      - name: Locate and Publish to Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          SNAP_FILE=$(ls dist-electron/*.snap | head -n 1)
          echo "Found snap: $SNAP_FILE"
          sudo snap install --classic snapcraft
          snapcraft upload "$SNAP_FILE" --release stable

      - name: Upload Snap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsarMusicPlayer-Linux-Snap-Package
          path: dist-electron/*.snap
          if-no-files-found: error

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.snap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
