name: Release Snap to Ubuntu Store

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Linux Binaries (yt-dlp & ffmpeg)
        run: |
          mkdir -p bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
          chmod +x bin/yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cp /usr/bin/ffmpeg bin/ffmpeg
          chmod +x bin/ffmpeg
          ls -lh bin/

      - name: Build Web Assets
        run: npm run build

      - name: Build Snap Package
        run: npx electron-builder --linux snap --publish never

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: dist-electron/pulsar-music-player_*_amd64.snap
          release: stable
