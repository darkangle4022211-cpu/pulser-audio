name: Build Windows Store Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Package Windows AppX / MSIX
        run: npx electron-builder --win appx

      - name: Upload Store Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsarMusicPlayer-Windows-Store-Package
          path: dist-electron/*.appx
          if-no-files-found: error
