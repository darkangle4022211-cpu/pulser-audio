name: Build and Release Windows Store Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pre-download Windows Binaries (yt-dlp & ffmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/win
          if (!(Test-Path "bin/win/yt-dlp.exe")) {
            Write-Host "Downloading yt-dlp.exe..."
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/win/yt-dlp.exe"
          }
          if (!(Test-Path "bin/win/ffmpeg.exe")) {
            Write-Host "Downloading ffmpeg..."
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
            Write-Host "Extracting ffmpeg.exe..."
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp" -Force
            $ffmpeg = Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            Copy-Item -Path $ffmpeg.FullName -Destination "bin/win/ffmpeg.exe"
            Remove-Item -Path "ffmpeg.zip", "ffmpeg_temp" -Recurse -Force
          }
          Copy-Item "bin/win/yt-dlp.exe" -Destination "bin/yt-dlp.exe" -Force
          Copy-Item "bin/win/ffmpeg.exe" -Destination "bin/ffmpeg.exe" -Force
          Write-Host "Binaries verified in bin/win:"
          Get-ChildItem -Path "bin/win"

      - name: Build Web Frontend
        run: npm run build

      - name: Package Windows AppX / MSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win appx --publish never

      - name: Upload Store Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsarMusicPlayer-Windows-Store-Package
          path: dist-electron/*.appx
          if-no-files-found: error

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.appx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
