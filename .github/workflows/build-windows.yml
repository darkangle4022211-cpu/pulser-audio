name: Build and Release Windows Store Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Package Windows AppX / MSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win appx --publish never

      - name: Upload Store Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsarMusicPlayer-Windows-Store-Package
          path: dist-electron/*.appx
          if-no-files-found: error

      - name: Publish to Microsoft Store
        if: startsWith(github.ref, 'refs/tags/v')
        uses: kanekotic/microsoft-store-publish@v1
        with:
          tenant-id: ${{ secrets.MS_STORE_TENANT_ID }}
          client-id: ${{ secrets.MS_STORE_CLIENT_ID }}
          client-secret: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          app-id: ${{ secrets.MS_STORE_PRODUCT_ID }}
          package-path: dist-electron/*.appx
